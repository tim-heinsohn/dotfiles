session_name: superskills
start_directory: ~/superskills
windows:
  - window_name: "#superskills"
    panes:
      - opencode
  - window_name: "superskills>"
    panes:
      -
  - window_name: "superskills_"
    panes:
      - nvim
  - window_name: "superskills~"
    panes:
      - pane_title: sb
        shell_command: journalctl --user -u fetch-substack -f
      - pane_title: yt
        shell_command: journalctl --user -u fetch-youtube -f
